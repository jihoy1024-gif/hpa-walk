<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>HPA Campus Walk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
body { margin: 0; }
/* Layout: full-bleed 3D campus; glass HUD pinned to the corners, join card centered. Single Waimea-dusk look by choice. */
:root {
  --dusk: #2a2741;
  --glass: rgba(34, 30, 58, 0.6);
  --glass-line: rgba(255, 210, 214, 0.22);
  --foam: #fff7f2;
  --coral: #ff8f7a;
  --hibiscus: #ec4f86;
  --mute: #f6d3d2;
  --display: "Gowun Batang", "Noto Serif KR", Georgia, serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--dusk); color: var(--foam); }
body { font-family: var(--body); overflow: hidden; }
#app { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
#c { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 4px; white-space: nowrap; }
.tag .nm { font-size: 13px; padding: 2px 9px; border-radius: 99px; background: rgba(28, 24, 48, 0.55); border: 1px solid var(--glass-line); letter-spacing: 0.02em; }
.tag .say { max-width: 220px; white-space: normal; text-align: center; font-size: 14px; line-height: 1.35; padding: 6px 11px; border-radius: 14px; background: var(--foam); color: #2a2238; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
.tag .say:empty { display: none; }

.hud { position: absolute; display: flex; gap: 10px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.top { top: 0; left: 0; right: 0; justify-content: space-between; align-items: flex-start; flex-wrap: wrap;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(26px, 4vw, 38px); line-height: 1; letter-spacing: 0.01em; text-shadow: 0 2px 18px rgba(70, 20, 40, 0.45); }
.brand p { margin: 6px 0 0; font-size: 13px; color: var(--mute); text-shadow: 0 1px 8px rgba(0,0,0,0.45); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { font: inherit; font-size: 12px; color: var(--foam); background: var(--glass); border: 1px solid var(--glass-line); border-radius: 99px; padding: 4px 10px; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.chip:hover { background: rgba(255,255,255,0.18); }
.chip[aria-pressed="true"] { background: var(--foam); color: #2a1620; }
.chip:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
.panel { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#peers { padding: 10px 12px; min-width: 0; max-width: 300px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
#peers .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--mute); }
#peers .row { display: flex; align-items: center; gap: 8px; }
#peers .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); }
#peers .me { color: var(--mute); font-size: 12px; }
#peers .hint { color: var(--mute); font-size: 12px; line-height: 1.45; white-space: normal; }

.bottom { left: 0; right: 0; bottom: 0; justify-content: center; align-items: center; flex-wrap: wrap;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; gap: 6px; align-items: center; padding: 6px; min-width: 0; max-width: 100%; }
#say { width: min(300px, 46vw); min-width: 0; font: inherit; font-size: 15px; color: var(--foam); background: rgba(255,255,255,0.08); border: 1px solid transparent; border-radius: 10px; padding: 9px 12px; outline: none; }
#say::placeholder { color: rgba(246, 211, 210, 0.7); }
#say:focus { border-color: var(--coral); }
.btn { font: inherit; font-size: 14px; color: var(--foam); background: rgba(255,255,255,0.08); border: 1px solid transparent; border-radius: 10px; padding: 9px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,0.16); }
.btn:focus-visible, #say:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--coral); color: #2a1620; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.heart svg { fill: var(--hibiscus); }
.btn.pulse { background: var(--hibiscus); color: var(--foam); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(236, 79, 134, 0.25); } }
@media (prefers-reduced-motion: reduce) { .btn.pulse { animation: none; } }
#toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(104px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); padding: 8px 14px; font-size: 14px; text-align: center; pointer-events: none; }
#ctx { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(146px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); padding: 6px 12px; font-size: 13px; pointer-events: none; white-space: nowrap; }
#goal { position: absolute; left: 0; right: 0; top: 28%; text-align: center; font-family: var(--display); font-weight: 700; font-size: clamp(48px, 10vw, 96px); color: var(--foam); text-shadow: 0 4px 30px rgba(236, 79, 134, 0.7); pointer-events: none; }
.menu { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, auto); gap: 6px; padding: 8px; max-width: calc(100% - 32px); }
.menu .btn { justify-content: space-between; gap: 10px; }
.menu kbd { font: inherit; font-size: 11px; color: var(--mute); border: 1px solid var(--glass-line); border-radius: 5px; padding: 0 5px; }
#help { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--mute); text-shadow: 0 1px 6px rgba(0,0,0,0.6); white-space: nowrap; pointer-events: none; }

#stick { position: absolute; left: calc(24px + env(safe-area-inset-left, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 116px; height: 116px; border-radius: 50%; background: rgba(255,255,255,0.10); border: 1px solid var(--glass-line); touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255, 247, 242, 0.55); }

#join { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 60%, rgba(42, 39, 65, 0.12), rgba(42, 39, 65, 0.55));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { width: min(400px, 100%); padding: 26px 24px 22px; display: flex; flex-direction: column; gap: 16px; }
.card h2 { margin: 0; font-family: var(--display); font-size: 28px; line-height: 1.15; text-wrap: balance; }
.card p { margin: 0; color: var(--mute); line-height: 1.55; font-size: 14px; }
.card label { font-size: 12px; letter-spacing: 0.1em; color: var(--mute); }
.card .field { display: flex; flex-direction: column; gap: 6px; }
#nick { font: inherit; font-size: 16px; color: var(--foam); background: rgba(255,255,255,0.08); border: 1px solid var(--glass-line); border-radius: 10px; padding: 10px 12px; outline: none; }
#nick:focus { border-color: var(--coral); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.sw[aria-checked="true"] { border-color: var(--foam); box-shadow: 0 0 0 3px rgba(255,255,255,0.18); }
.sw:focus-visible { outline: 2px solid var(--foam); outline-offset: 2px; }
#go { justify-content: center; background: var(--coral); color: #2a1620; font-weight: 700; font-size: 16px; padding: 12px; }
#go:hover { background: #ffa593; }
.seg { display: flex; gap: 6px; }
.segb { flex: 1; font: inherit; font-size: 15px; color: var(--foam); background: rgba(255,255,255,0.08); border: 1px solid var(--glass-line); border-radius: 10px; padding: 9px; cursor: pointer; }
.segb[aria-checked="true"] { background: var(--foam); color: #2a1620; border-color: transparent; }
.segb:focus-visible { outline: 2px solid var(--foam); outline-offset: 2px; }
.status { font-size: 12px; color: var(--mute); line-height: 1.5; }

@media (max-width: 600px) {
  #peers { max-width: 100%; }
  #help { display: none; }
  #say { width: 34vw; }
  .btn .tx { display: none; }
  .menu { grid-template-columns: repeat(2, auto); }
  .menu .btn .tx { display: inline; }
}
</style>
</head>
<body>

<div id="app">
  <canvas id="c" aria-label="3D scene of the HPA campus in Waimea at sunset"></canvas>
  <div id="labels"></div>

  <header class="hud top">
    <div class="brand">
      <h1>Hawaiʻi Prep</h1>
      <p>Waimea, Hawaiʻi Island · <span id="tod">Golden hour</span> · Hawaiʻi time <span id="hst">--:--</span></p>
      <div class="chips" id="times" role="group" aria-label="Time of day"></div>
    </div>
    <div id="peers" class="panel" aria-live="polite"></div>
  </header>

  <div id="help">WASD walk · Shift run · Drag look · X sit · Z lie down · C hula · V wave · F kick · R golf cart · P first person · H heart · G hold hands · Enter talk</div>
  <div id="ctx" class="panel" role="status" hidden></div>
  <div id="goal" hidden>Goal!</div>
  <div id="moves" class="panel menu" hidden>
    <button class="btn" type="button" data-m="sit">Sit <kbd>X</kbd></button>
    <button class="btn" type="button" data-m="lie">Lie down <kbd>Z</kbd></button>
    <button class="btn" type="button" data-m="hula">Hula <kbd>C</kbd></button>
    <button class="btn" type="button" data-m="wave">Wave <kbd>V</kbd></button>
    <button class="btn" type="button" data-m="kick">Kick / hit <kbd>F</kbd></button>
    <button class="btn" type="button" data-m="ride">Golf cart <kbd>R</kbd></button>
  </div>
  <div id="toast" class="panel" role="status" hidden></div>
  <div id="stick" hidden><div id="knob"></div></div>

  <div class="hud bottom">
    <form class="bar panel" id="sayForm" autocomplete="off">
      <input id="say" maxlength="80" placeholder="Say something…" aria-label="Speech bubble message">
      <button class="btn" type="button" id="movesBtn" aria-expanded="false" aria-controls="moves" title="Sit, lie down, hula, wave, kick, golf cart"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M5 10l4-1.5h6L19 7M12 8.5V14l-3.5 6.5M12 14l3.5 6.5"/></svg><span class="tx">Moves</span></button>
      <button class="btn heart" type="button" id="heartBtn" title="Send a heart (H)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg><span class="tx">Heart</span></button>
      <button class="btn" type="button" id="holdBtn" aria-pressed="false" disabled title="Hold hands (G): stand close and both press it"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l4-4 3 1 2-2M21 13l-4-4-3 1-4 4a1.4 1.4 0 0 0 2 2l2-2 2 2M7 9l-2 7M17 9l2 7"/></svg><span class="tx" id="holdTx">Hold hands</span></button>
      <button class="btn" type="button" id="followBtn" aria-pressed="false" disabled title="Walk together: stay at their side"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="5" r="2"/><circle cx="16" cy="5" r="2"/><path d="M8 8v6l-2 7M8 14l2 7M16 8v6l-2 7M16 14l2 7M8 10h8"/></svg><span class="tx">Walk together</span></button>
      <button class="btn" type="button" id="fpBtn" aria-pressed="false" title="First-person view (P)"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="tx">First person</span></button>
      <button class="btn" type="button" id="soundBtn" aria-pressed="false" title="Wind and birdsong"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 17h7"/></svg><span class="tx">Wind</span></button>
    </form>
  </div>

  <div id="join">
    <div class="card panel" role="dialog" aria-labelledby="joinTitle">
      <h2 id="joinTitle">Where Jiho and Isa met</h2>
      <div class="field">
        <label for="nick">Name</label>
        <input id="nick" maxlength="16" placeholder="Your name on campus">
      </div>
      <div class="field">
        <label id="genderLbl">I am</label>
        <div class="seg" id="gender" role="radiogroup" aria-labelledby="genderLbl">
          <button type="button" class="segb" role="radio" data-g="m" aria-checked="true">Man</button>
          <button type="button" class="segb" role="radio" data-g="f" aria-checked="false">Woman</button>
        </div>
      </div>
      <div class="field">
        <label id="colorLbl">Lei color</label>
        <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="colorLbl"></div>
      </div>
      <button class="btn" id="go" type="button">Enter campus</button>
      <div class="status" id="status">Checking connection…</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="world.js?v=12"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const COLORS = ['#4f8a3a', '#f28cb4', '#f4efe2', '#f2b84b', '#e0533d', '#9b6dd6']; // lei: maile green, pink, white plumeria, ʻilima, red, orchid
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- world (terrain, campus, sky, light) lives in world.js ----------
const canvas = $('c');
const W = window.HPA.createWorld(canvas);
const { scene, renderer, camera, groundH, colliders, C } = W;

// ---------- hearts ----------
const heartTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64; const g = cv.getContext('2d');
  g.fillStyle = '#ff5d8f'; g.translate(32, 34); g.beginPath();
  g.moveTo(0, 20); g.bezierCurveTo(-30, 2, -22, -24, 0, -10); g.bezierCurveTo(22, -24, 30, 2, 0, 20); g.fill();
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; return t;
})();
const hearts = [];
function spawnHearts(pos, n) {
  for (let i = 0; i < n; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: heartTex, transparent: true, depthWrite: false }));
    s.position.set(pos.x + (Math.random() - 0.5) * 0.6, pos.y + 1.9 + Math.random() * 0.3, pos.z + (Math.random() - 0.5) * 0.6);
    const sc = 0.25 + Math.random() * 0.2; s.scale.set(sc, sc, 1);
    scene.add(s); hearts.push({ s, life: 0, delay: i * 0.12, vx: (Math.random() - 0.5) * 0.4 });
  }
}

// ---------- avatars ----------
// Hawaiian dress: white aloha shirt and trousers with a red sash (kāʻei) and an open maile lei for him;
// a white floral holokū with a ruffled neckline and a flower lei for her.
const skinTones = [0xe2b08a, 0xc98e66, 0xa8714d, 0xf0c7a4];
const floralTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d');
  g.fillStyle = '#f7f5ef'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = 'rgba(185,180,165,0.55)'; g.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    const x = (i * 97) % 256, y = (i * 61) % 256;
    for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; g.beginPath(); g.ellipse(x + Math.cos(a) * 14, y + Math.sin(a) * 14, 12, 3, a, 0, Math.PI * 2); g.stroke(); }
    g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + 30, y + 20, x + 10, y + 50, x + 40, y + 70); g.stroke();
  }
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2); return t;
})();
function makeAvatar(leiColor, skinIdx, gender) {
  const fem = gender === 'f';
  const g = new THREE.Group(), p = new THREE.Group(); g.add(p);
  const std = (c, r, extra) => new THREE.MeshStandardMaterial(Object.assign({ color: C(c), roughness: r }, extra || {}));
  const cloth = std(0xf7f5ef, 0.8, fem ? { map: floralTex } : {});
  const skin = std(skinTones[skinIdx % skinTones.length], 0.7);
  const hair = std(0x2a1d17, 0.6);
  const lei = std(leiColor, 0.8);
  const red = std(0xc4242b, 0.7);
  const add = (parent, geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
  add(p, fem ? new THREE.CylinderGeometry(0.16, 0.19, 0.6, 16) : new THREE.CylinderGeometry(0.2, 0.22, 0.62, 16), cloth, 0, 1.07, 0);
  if (!fem) { const sh = add(p, new THREE.SphereGeometry(0.205, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), cloth, 0, 1.36, 0); sh.scale.y = 0.35; }
  add(p, new THREE.CylinderGeometry(0.06, 0.07, 0.12, 10), skin, 0, 1.43, 0);
  add(p, new THREE.SphereGeometry(0.2, 18, 14), skin, 0, 1.6, 0);
  const cap = add(p, new THREE.SphereGeometry(0.215, 18, 10, 0, Math.PI * 2, 0, Math.PI * 0.42), hair, 0, 1.62, 0); cap.rotation.x = -0.4;
  if (fem) {
    add(p, new THREE.CylinderGeometry(0.2, 0.25, 0.62, 16, 1, false, Math.PI * 0.55, Math.PI * 0.9), hair, 0, 1.42, -0.01);
    add(p, new THREE.SphereGeometry(0.222, 16, 10, Math.PI * 0.55, Math.PI * 0.9, 0, Math.PI * 0.5), hair, 0, 1.6, 0);
    add(p, new THREE.SphereGeometry(0.06, 10, 8), std(0xffffff, 0.6), 0.17, 1.68, 0.06); // plumeria behind the ear
    add(p, new THREE.SphereGeometry(0.025, 6, 6), std(0xf2c14e, 0.6), 0.2, 1.69, 0.09);
  }
  const eyeM = new THREE.MeshBasicMaterial({ color: 0x1b1420 });
  [-0.07, 0.07].forEach((x) => add(p, new THREE.SphereGeometry(0.025, 6, 6), eyeM, x, 1.62, 0.18));
  // limbs hang from pivot groups so poses can swing them
  const limb = (x, y, r, len, mat, endMat, endR) => {
    const pv = new THREE.Group(); pv.position.set(x, y, 0); p.add(pv);
    add(pv, new THREE.CylinderGeometry(r, r * 0.9, len, 10), mat, 0, -len / 2, 0);
    if (endMat) add(pv, new THREE.SphereGeometry(endR, 10, 8), endMat, 0, -len - endR * 0.6, 0);
    return pv;
  };
  const legMat = fem ? skin : cloth;
  const legL = limb(-0.105, 0.7, fem ? 0.06 : 0.09, 0.62, legMat), legR = limb(0.105, 0.7, fem ? 0.06 : 0.09, 0.62, legMat);
  [legL, legR].forEach((l) => add(l, new THREE.BoxGeometry(0.1, 0.06, 0.22), skin, 0, -0.66, 0.05)); // bare feet
  const armL = limb(-0.26, 1.33, fem ? 0.05 : 0.065, 0.5, fem ? skin : cloth, skin, 0.055);
  const armR = limb(0.26, 1.33, fem ? 0.05 : 0.065, 0.5, fem ? skin : cloth, skin, 0.055);
  armL.rotation.z = -0.12; armR.rotation.z = 0.12;
  const racket = new THREE.Group(); racket.position.set(0, -0.6, 0.03); racket.visible = false; armR.add(racket);
  add(racket, new THREE.CylinderGeometry(0.016, 0.016, 0.3, 8), std(0x222226, 0.5), 0, -0.12, 0);
  const rh = add(racket, new THREE.TorusGeometry(0.13, 0.013, 6, 24), std(0x2f6fd0, 0.4), 0, -0.4, 0); rh.scale.y = 1.25;
  add(racket, new THREE.CircleGeometry(0.12, 20), new THREE.MeshStandardMaterial({ color: 0xf2f2ee, transparent: true, opacity: 0.35, side: THREE.DoubleSide }), 0, -0.4, 0).scale.y = 1.25;
  let skirt = null;
  if (fem) {
    skirt = new THREE.Group(); skirt.position.y = 0.84; p.add(skirt);

    let lx = dx * c - dz * s, lz = dx * s + dz * c;
    if (Math.abs(lx) >= b.hw || Math.abs(lz) >= b.hd) continue;
    if (b.hw - Math.abs(lx) < b.hd - Math.abs(lz)) lx = Math.sign(lx || 1) * b.hw; else lz = Math.sign(lz || 1) * b.hd;
    o.x = b.x + lx * c + lz * s; o.z = b.z - lx * s + lz * c;
  }
  o.x = Math.max(W.bounds.minX, Math.min(W.bounds.maxX, o.x));
  o.z = Math.max(W.bounds.minZ, Math.min(W.bounds.maxZ, o.z));
}
const tmp = new THREE.Vector3(), clock = new THREE.Clock();
let t = 0, nearHeartT = 0, holdUiT = 0, wasHolding = false, perfAcc = 0, perfN = 0, quality = 2;
function placeTag(tag, obj, now) {
  tmp.set(obj.position.x, obj.position.y + 2.05, obj.position.z).project(camera);
  if (tmp.z > 1 || Math.abs(tmp.x) > 1.2 || Math.abs(tmp.y) > 1.2) { tag.el.style.display = 'none'; return; }
  tag.el.style.display = '';
  tag.el.style.left = ((tmp.x + 1) / 2 * canvas.clientWidth) + 'px';
  tag.el.style.top = ((1 - tmp.y) / 2 * canvas.clientHeight) + 'px';
  if (tag.sayUntil && now > tag.sayUntil) { tag.say.textContent = ''; tag.sayUntil = 0; }
}
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); t += reduceMotion ? dt * 0.3 : dt;
  const now = performance.now();

  let ix = 0, iz = 0;
  if (entered && !typing()) {
    if (keys.has('KeyW') || keys.has('ArrowUp')) iz += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) iz -= 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
    if (keys.has('KeyQ')) camYaw += dt * 1.6;
    if (keys.has('KeyE')) camYaw -= dt * 1.6;
  }
  if (joy.id !== null) { ix += joy.x; iz -= joy.y; }
  const run = keys.has('ShiftLeft') || keys.has('ShiftRight') || Math.hypot(joy.x, joy.y) > 0.95;
  // carts someone else is driving glide toward the pose they report
  for (const c of W.carts) {
    if (me.ride && me.ride.id === c.id && me.ride.s === 0) continue;
    const tg = cartTarget.get(c.id); if (!tg) continue;
    const kk = 1 - Math.exp(-8 * dt);
    W.placeCart(c, c.x + (tg[0] - c.x) * kk, c.z + (tg[1] - c.z) * kk, lerpAngle(c.ry, tg[2], kk));
  }
  let vx = 0, vz = 0, partner = null;
  if (me.ride) {
    const c = cartById.get(me.ride.id);
    if (me.ride.s === 0) { driveCart(dt, ix, iz); camYaw = lerpAngle(camYaw, c.ry + Math.PI, 1 - Math.exp(-2.5 * dt)); }
    // two people claiming the same seat: the earlier peer label keeps it
    let other = null;
    for (const [pid, r] of remotes) if (r.ride && r.ride.id === me.ride.id && r.ride.s === me.ride.s) other = pid;
    if (other && myPeer && other < myPeer) { toggleRide(); flash('Someone else took that seat'); }
    else {
      const seat = W.cartSeat(c, me.ride.s);
      me.x = seat.x; me.z = seat.z; me.ry = c.ry; me.speed = 0; me.lift = seat.y - groundH(me.x, me.z);
    }
  } else {
    if ((ix || iz) && me.act) { standUp(); sendPresence(true); }
    const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
    if (ix || iz) {
      if (following) setFollow(null);
      const L = Math.max(1, Math.hypot(ix, iz)), sp = W.inPool(me.x, me.z) ? (run ? 2.6 : 1.6) : (run ? 6.5 : 3.2);
      vx = (fx * iz + rx * ix) / L * sp; vz = (fz * iz + rz * ix) / L * sp;
    } else if (following && remotes.has(following) && !me.act) {
      const p = remotes.get(following);
      const tx = p.x + Math.cos(p.ry) * 0.95, tz = p.z - Math.sin(p.ry) * 0.95;
      const dx = tx - me.x, dz = tz - me.z, d = Math.hypot(dx, dz);
      if (d > 0.15) { const sp = Math.min(d * 3, 8); vx = dx / d * sp; vz = dz / d * sp; }
      else me.ry = lerpAngle(me.ry, p.ry, 1 - Math.exp(-6 * dt));
    }
    const ox = me.x, oz = me.z;
    if (vx || vz) { me.x += vx * dt; me.z += vz * dt; collide(me); }
    // holding hands: whoever walks leads, the idle one is pulled along at arm's length
    partner = me.act ? null : holdingWith();
    if (partner && !(ix || iz) && !partner.ride && !partner.act) {
      const dx = me.x - partner.x, dz = me.z - partner.z, d = Math.hypot(dx, dz) || 1;
      if (d > 0.95) { me.x = partner.x + dx / d * 0.95; me.z = partner.z + dz / d * 0.95; collide(me); }
      else if (d < 0.6) { me.x = partner.x + dx / d * 0.6; me.z = partner.z + dz / d * 0.6; }
    }
    const moved = Math.hypot(me.x - ox, me.z - oz);
    me.speed = moved / Math.max(dt, 1e-4);
    if (firstPerson && !me.seat && me.act !== 'lie') me.ry = Math.atan2(-Math.sin(camYaw), -Math.cos(camYaw));
    else if (moved > 0.002) me.ry = lerpAngle(me.ry, Math.atan2(me.x - ox, me.z - oz), 1 - Math.exp(-10 * dt));
    if (!me.act) dribble(me.speed > 0.3 ? (me.x - ox) / dt : 0, me.speed > 0.3 ? (me.z - oz) / dt : 0);
    me.lift = me.seat && seatById.has(me.seat) ? seatById.get(me.seat).y - groundH(me.x, me.z) : null;
  }
  if (!!partner !== wasHolding) {
    wasHolding = !!partner;
    if (partner) spawnHearts(tmp.set((partner.x + me.x) / 2, me.av.g.position.y, (partner.z + me.z) / 2).clone(), 6);
  }
  me.av.g.position.set(me.x, groundH(me.x, me.z), me.z); me.av.g.rotation.y = me.ry;
  const swimming = !me.ride && W.inPool(me.x, me.z);
  if (swimming && me.act) standUp();
  animateAvatar(me.av, me.speed, dt, swimming ? (me.speed > 0.3 ? 'swim' : 'tread') : me.act, me.lift);
  if (partner) reachArm(me.av, me.ry, me.x, me.z, partner.x, partner.z);
  stepBall(dt);
  stepTennis(dt);
  me.av.racket.visible = TN.inside(me.x, me.z);
  sendPresence(false);
  if (now > holdUiT) { holdUiT = now + 150; updateHoldUi(); updateCtx(); }

  const k = 1 - Math.exp(-9 * dt);
  for (const r of remotes.values()) {
    let lift = null;
    if (r.ride) {
      const c = cartById.get(r.ride.id), seat = W.cartSeat(c, r.ride.s);
      r.x = seat.x; r.z = seat.z; r.ry = c.ry; r.speed = 0; lift = seat.y - groundH(r.x, r.z);
    } else {
      const px = r.x, pz = r.z;
      r.x += (r.tx - r.x) * k; r.z += (r.tz - r.z) * k; r.ry = lerpAngle(r.ry, r.tr, k);
      const mv = Math.hypot(r.x - px, r.z - pz); r.speed = r.speed * 0.8 + (mv / Math.max(dt, 1e-4)) * 0.2;
      if (r.act === 'sit' && r.seat) lift = seatById.get(r.seat).y - groundH(r.x, r.z);
    }
    r.av.g.position.set(r.x, groundH(r.x, r.z), r.z); r.av.g.rotation.y = r.ry;
    const rSwim = !r.ride && W.inPool(r.x, r.z);
    animateAvatar(r.av, r.speed, dt, r.ride ? (r.ride.s === 0 ? 'drive' : 'ride') : rSwim ? (r.speed > 0.3 ? 'swim' : 'tread') : r.act, lift);
    r.av.racket.visible = TN.inside(r.x, r.z);
    if (partner && r === partner) reachArm(r.av, r.ry, r.x, r.z, me.x, me.z);
    if (Math.hypot(r.x - me.x, r.z - me.z) < 1.7 && now > nearHeartT) {
      nearHeartT = now + 2600;
      spawnHearts(tmp.set((r.x + me.x) / 2, Math.max(r.av.g.position.y, me.av.g.position.y) + 0.2, (r.z + me.z) / 2).clone(), 1);
    }
  }

  // world: flags, shadow frustum, sky
  const gust = W.update(dt, t, me.av.g.position);
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    if (h.delay > 0) { h.delay -= dt; h.s.visible = false; continue; }
    h.s.visible = true; h.life += dt;
    h.s.position.y += dt * 0.7; h.s.position.x += Math.sin(h.life * 4) * 0.004 + h.vx * dt;
    h.s.material.opacity = Math.max(0, 1 - h.life / 2.2);
    if (h.life > 2.2) { scene.remove(h.s); h.s.material.dispose(); hearts.splice(i, 1); }
  }
  if (ac && ac.state === 'running') {
    windFilter.frequency.setTargetAtTime(300 + gust * 700, ac.currentTime, 0.3);
    windGain.gain.setTargetAtTime(0.08 + gust * 0.22, ac.currentTime, 0.4);
    if (now > nextBird) { if (nextBird) chirp(); nextBird = now + 4000 + Math.random() * 9000; }
  }

  // camera
  me.av.g.visible = !firstPerson;
  if (firstPerson) {
    const eyeY = me.av.g.position.y + me.av.p.position.y + (me.act === 'lie' ? 0.32 : 1.62);
    const dx = -Math.sin(camYaw), dz = -Math.cos(camYaw), cp = Math.cos(fpPitch);
    camera.position.set(me.x + dx * 0.14, eyeY, me.z + dz * 0.14);
    camera.lookAt(camera.position.x + dx * cp, eyeY + Math.sin(fpPitch), camera.position.z + dz * cp);
  } else {
    const head = tmp.set(me.x, me.av.g.position.y + 1.4, me.z);
    const cx = head.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist, cz = head.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist;
    camera.position.set(cx, Math.max(head.y + Math.sin(camPitch) * camDist, groundH(cx, cz) + 0.6), cz);
    camera.lookAt(head);
  }
  if (!entered) camYaw += dt * 0.04;

  renderer.render(scene, camera);
  // step quality down if the frame rate stays low
  if (now > 6000) { perfAcc += dt; perfN++; if (perfAcc > 4) { if (perfAcc / perfN > 0.034 && quality > 0) quality = W.setQuality(quality - 1); perfAcc = 0; perfN = 0; } }
  if (firstPerson) me.tag.el.style.display = 'none'; else placeTag(me.tag, me.av.g, now);
  for (const r of remotes.values()) placeTag(r.tag, r.av.g, now);
  requestAnimationFrame(frame);
}

// time of day, remembered per viewer
const timesBox = $('times');
function pickTime(key) {
  const T = W.setTime(key);
  $('tod').textContent = T.label;
  [...timesBox.children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === W.timeKey)));
  try { localStorage.setItem('hpa-time', W.timeKey); } catch (e) {}
}
Object.entries(W.times).forEach(([k, T]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.k = k; b.textContent = T.label;
  b.onclick = () => pickTime(k); timesBox.append(b);
});
let savedTime = 'golden';
try { savedTime = localStorage.getItem('hpa-time') || 'golden'; } catch (e) {}
pickTime(savedTime);

function clockHST() { const d = new Date(Date.now() - 10 * 3600e3); $('hst').textContent = d.toISOString().slice(11, 16); }
clockHST(); setInterval(clockHST, 10000);

me.tag.nm.textContent = 'You';
renderPeers();
connectRoom();
prefillName();
requestAnimationFrame(frame);
})();
</script>
